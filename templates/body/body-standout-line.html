<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <!-- GENERIC (per-client themed) HyperFrames sub-composition template.
         Structurally identical to hyperframes_templates/body/body-standout-line.html
         (same markup, same GSAP timeline, same timing) -- ONLY colour, font, and the
         brand mark are parameterized. See CONTRACT.md §3.1.
         CONTENT PLACEHOLDERS (per CONTRACT.md §2):
           {{FRAME_ID}}      unique-per-instance id
           {{PROGRESS_PCT}}  progress-bar fill width
           {{LINE_1}}        line 1 (required); a word may be [[emphasis]] accent
           {{LINE_2}}        line 2 (optional — leave empty string to omit)
           {{LINE_3}}        line 3 (optional — leave empty string to omit)
         THEME PLACEHOLDERS (per CONTRACT.md §3.1):
           {{THEME_FONT_IMPORT}} {{THEME_BG}} {{THEME_TEXT}} {{THEME_LEAD_TEXT}}
           {{THEME_ACCENT}} {{THEME_ACCENT_TEXT}} {{THEME_FONT}} {{LOGO_MARKUP}} -->
  </head>
  <body>
    <template>
      <style>
        {{THEME_FONT_IMPORT}}

        :root {
          --theme-bg: {{THEME_BG}};
          --theme-bg-pattern: {{THEME_BG_PATTERN}};
          --theme-text: {{THEME_TEXT}};
          --theme-lead-text: {{THEME_LEAD_TEXT}};
          --theme-accent: {{THEME_ACCENT}};
          --theme-font: {{THEME_FONT}};
          --theme-accent-a20: color-mix(in srgb, var(--theme-accent) 20%, transparent);
        }

        #root {
          position: absolute; inset: 0; width: 1080px; height: 1920px;
          container-type: size; overflow: hidden; background: var(--theme-bg);
          font-family: var(--theme-font); color: var(--theme-text);
        }
        .bg { position: absolute; inset: 0; background-color: var(--theme-bg); background-image: var(--theme-bg-pattern, none); }

        .brand-mark { position: absolute; top: 5cqw; left: 5cqw; width: 6cqw; height: 6cqw; }
        .brand-mark img { display: block; width: 100%; height: 100%; object-fit: contain; object-position: left center; }
        .brand-mark:empty { display: none; }

        .progress-track {
          position: absolute; left: 0; right: 0; bottom: 0;
          height: 4px; background: var(--theme-accent-a20);
        }
        .progress-fill { height: 100%; width: {{PROGRESS_PCT}}; background: var(--theme-accent); }

        .stage {
          position: absolute; left: 50%; top: 46%;
          transform: translate(-50%, -50%);
          display: flex; flex-direction: column; align-items: center;
          gap: 2.4cqh; width: 88cqw;
        }
        .accent-line-svg { display: block; width: 60px; height: 4px; overflow: visible; margin-bottom: 1.5cqh; }
        .accent-line-svg line { stroke: var(--theme-accent); stroke-width: 4; stroke-linecap: square; }

        .line {
          margin: 0; display: flex; flex-wrap: wrap; justify-content: center;
          text-align: center; font-weight: 800; font-size: 9.6cqw;
          line-height: 1.06; letter-spacing: -0.02em; color: var(--theme-text);
        }
        .word { display: inline-block; will-change: transform, opacity; }
        .word:not(:last-child) { margin-right: 0.26em; }
        .word.accent { color: var(--theme-accent); }
      </style>

      <div id="root" data-composition-id="{{FRAME_ID}}" data-width="1080" data-height="1920">
        <div class="bg"></div>

        <div class="brand-mark">{{LOGO_MARKUP}}</div>

        <div class="stage">
          <svg class="accent-line-svg" viewBox="0 0 60 4">
            <line class="accent-line-stroke" x1="2" y1="2" x2="58" y2="2" />
          </svg>
          <p class="line" data-role="line">{{LINE_1}}</p>
          <p class="line" data-role="line">{{LINE_2}}</p>
          <p class="line" data-role="line">{{LINE_3}}</p>
        </div>

        <div class="progress-track"><div class="progress-fill"></div></div>
      </div>

      <script>
        function hfSplitWords(el) {
          if (!el) return [];
          const raw = (el.textContent || "").trim();
          el.textContent = "";
          const spans = [];
          // Split on [[...]] phrase boundaries first (a bracket pair may wrap more
          // than one word, e.g. "[[really matters]]" — every word inside one pair
          // gets the accent). Trailing punctuation glued to the closing brackets
          // (e.g. "[[results]],") travels with the phrase and lands on its last word.
          const parts = raw.split(/(\[\[[\s\S]+?\]\][.,!?;:]*)/g);
          parts.forEach((part) => {
            if (!part) return;
            const m = part.match(/^\[\[([\s\S]+?)\]\]([.,!?;:]*)$/);
            if (m) {
              const words = m[1].trim().split(/\s+/).filter(Boolean);
              words.forEach((w, i) => {
                const span = document.createElement("span");
                span.className = "word accent";
                span.textContent = w + (i === words.length - 1 ? m[2] : "");
                el.appendChild(span);
                spans.push(span);
              });
            } else {
              part.trim().split(/\s+/).filter(Boolean).forEach((w) => {
                const span = document.createElement("span");
                span.className = "word";
                span.textContent = w;
                el.appendChild(span);
                spans.push(span);
              });
            }
          });
          return spans;
        }

        window.__timelines = window.__timelines || {};
        const root = document.querySelector('[data-composition-id="{{FRAME_ID}}"]');
        const tl = gsap.timeline({ paused: true });

        const lineEl = root.querySelector(".accent-line-stroke");
        const lineLen = lineEl.getTotalLength();
        lineEl.style.strokeDasharray = "" + lineLen;
        lineEl.style.strokeDashoffset = "" + lineLen;
        tl.to(lineEl, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 0.05);

        // Reveal each non-empty line in sequence; empty lines collapse out.
        let t = 0.35;
        root.querySelectorAll('[data-role="line"]').forEach((el) => {
          const words = hfSplitWords(el);
          if (words.length === 0) { el.style.display = "none"; return; }
          tl.fromTo(words, { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.08 }, t);
          t += 0.55;
        });

        window.__timelines["{{FRAME_ID}}"] = tl;
      </script>
    </template>
  </body>
</html>

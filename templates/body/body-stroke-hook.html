<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <!-- GENERIC (per-client themed) HyperFrames sub-composition template.
         Structurally identical to hyperframes_templates/body/body-stroke-hook.html
         (same markup, same GSAP timeline, same timing) -- ONLY colour, font, and the
         brand mark are parameterized. See hyperframes_templates/CONTRACT.md §3.1.
         CONTENT PLACEHOLDERS (per CONTRACT.md §2):
           {{FRAME_ID}}       unique-per-instance id (composition id + timeline key + svg ids)
           {{PROGRESS_PCT}}   progress-bar fill width, e.g. "12.5%"
           {{HEADLINE_TOP}}   2-4 words, stroke-outline (the setup)
           {{HEADLINE_PAYOFF}} 1-3 words, solid accent (the punch)
         THEME PLACEHOLDERS (per CONTRACT.md §3.1):
           {{THEME_FONT_IMPORT}} {{THEME_BG}} {{THEME_TEXT}} {{THEME_LEAD_TEXT}}
           {{THEME_ACCENT}} {{THEME_ACCENT_TEXT}} {{THEME_FONT}} {{LOGO_MARKUP}} -->
  </head>
  <body>
    <template>
      <style>
        {{THEME_FONT_IMPORT}}

        :root {
          --theme-bg: {{THEME_BG}};
          --theme-bg-pattern: {{THEME_BG_PATTERN}};
          --theme-text: {{THEME_TEXT}};
          --theme-lead-text: {{THEME_LEAD_TEXT}};
          --theme-accent: {{THEME_ACCENT}};
          --theme-font: {{THEME_FONT}};
          /* translucent accent, derived from the single accent (matches the
             original hardcoded rgba(255,125,155,0.2) progress-track tint) */
          --theme-accent-a20: color-mix(in srgb, var(--theme-accent) 20%, transparent);
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          container-type: size;
          overflow: hidden;
          background: var(--theme-bg);
          font-family: var(--theme-font);
        }
        .bg { position: absolute; inset: 0; background-color: var(--theme-bg); background-image: var(--theme-bg-pattern, none); }

        .brand-mark { position: absolute; top: 5cqw; left: 5cqw; width: 6cqw; height: 6cqw; }
        .brand-mark img { display: block; width: 100%; height: 100%; object-fit: contain; object-position: left center; }
        .brand-mark:empty { display: none; }

        .progress-track {
          position: absolute; left: 0; right: 0; bottom: 0;
          height: 4px; background: var(--theme-accent-a20);
        }
        .progress-fill { height: 100%; width: {{PROGRESS_PCT}}; background: var(--theme-accent); }

        .stage {
          position: absolute; left: 50%; top: 40cqh;
          transform: translate(-50%, -50%);
          display: flex; flex-direction: column; align-items: center;
          gap: 3.5cqh; width: 90cqw;
        }
        .line {
          display: flex; flex-wrap: wrap; justify-content: center;
          text-align: center;
        }
        .line-top .word {
          font-weight: 800; font-size: 9.4cqw; line-height: 1.05;
          letter-spacing: -0.02em;
          color: transparent; -webkit-text-stroke: 2px var(--theme-text);
        }
        .line-payoff .word {
          font-weight: 800; font-size: 13cqw; line-height: 1;
          letter-spacing: -0.02em; color: var(--theme-accent);
        }
        .word { display: inline-block; will-change: transform, opacity; }
        .word:not(:last-child) { margin-right: 0.3em; }

        .accent-line-svg { display: block; width: 90px; height: 4px; overflow: visible; }
        .accent-line-svg line { stroke: var(--theme-accent); stroke-width: 4; stroke-linecap: square; }
      </style>

      <div id="root" data-composition-id="{{FRAME_ID}}" data-width="1080" data-height="1920">
        <div class="bg"></div>

        <div class="brand-mark">{{LOGO_MARKUP}}</div>

        <div class="stage">
          <div class="line line-top" data-role="top">{{HEADLINE_TOP}}</div>
          <div class="line line-payoff" data-role="payoff">{{HEADLINE_PAYOFF}}</div>
          <svg class="accent-line-svg" viewBox="0 0 90 4">
            <line class="accent-line-stroke" x1="2" y1="2" x2="88" y2="2" />
          </svg>
        </div>

        <div class="progress-track"><div class="progress-fill"></div></div>
      </div>

      <script>
        // Split a headline element's text into per-word spans. A word wrapped in
        // [[double brackets]] gets the accent treatment. Deterministic,
        // runs synchronously at mount (no clocks, no async).
        function hfSplitWords(el) {
          if (!el) return [];
          const raw = (el.textContent || "").trim();
          el.textContent = "";
          const spans = [];
          // Split on [[...]] phrase boundaries first (a bracket pair may wrap more
          // than one word, e.g. "[[really matters]]" — every word inside one pair
          // gets the accent). Trailing punctuation glued to the closing brackets
          // (e.g. "[[results]],") travels with the phrase and lands on its last word.
          const parts = raw.split(/(\[\[[\s\S]+?\]\][.,!?;:]*)/g);
          parts.forEach((part) => {
            if (!part) return;
            const m = part.match(/^\[\[([\s\S]+?)\]\]([.,!?;:]*)$/);
            if (m) {
              const words = m[1].trim().split(/\s+/).filter(Boolean);
              words.forEach((w, i) => {
                const span = document.createElement("span");
                span.className = "word accent";
                span.textContent = w + (i === words.length - 1 ? m[2] : "");
                el.appendChild(span);
                spans.push(span);
              });
            } else {
              part.trim().split(/\s+/).filter(Boolean).forEach((w) => {
                const span = document.createElement("span");
                span.className = "word";
                span.textContent = w;
                el.appendChild(span);
                spans.push(span);
              });
            }
          });
          return spans;
        }

        window.__timelines = window.__timelines || {};
        const root = document.querySelector('[data-composition-id="{{FRAME_ID}}"]');
        const tl = gsap.timeline({ paused: true });

        const topWords = hfSplitWords(root.querySelector('[data-role="top"]'));
        const payoffWords = hfSplitWords(root.querySelector('[data-role="payoff"]'));
        const lineEl = root.querySelector(".accent-line-stroke");
        const lineLen = lineEl.getTotalLength();
        lineEl.style.strokeDasharray = "" + lineLen;
        lineEl.style.strokeDashoffset = "" + lineLen;

        // Setup words stroke in, per-word stagger, smooth power3 settle (no bounce on text).
        tl.fromTo(topWords, { opacity: 0, y: 32 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.15 }, 0.0);

        // Payoff lands solid accent beneath — the signature move.
        tl.fromTo(payoffWords, { opacity: 0, y: 32 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.1 }, 1.2);

        // Accent-line self-draws under the payoff (texture, not chrome).
        tl.to(lineEl, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 1.55);

        window.__timelines["{{FRAME_ID}}"] = tl;
      </script>
    </template>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <!-- GENERIC (per-client themed) HyperFrames sub-composition template.
         Structurally identical to hyperframes_templates/body/body-bridge.html (same
         markup, same GSAP timeline, same timing) -- ONLY colour, font, and the brand
         mark are parameterized. See CONTRACT.md §3.1.
         CONTENT PLACEHOLDERS (per CONTRACT.md §2):
           {{FRAME_ID}}      unique-per-instance id
           {{PROGRESS_PCT}}  progress-bar fill width
           {{HEADLINE}}      2-5 words, one word may be [[emphasis]] accent
         THEME PLACEHOLDERS (per CONTRACT.md §3.1):
           {{THEME_FONT_IMPORT}} {{THEME_BG}} {{THEME_TEXT}} {{THEME_LEAD_TEXT}}
           {{THEME_ACCENT}} {{THEME_ACCENT_TEXT}} {{THEME_FONT}} {{LOGO_MARKUP}} -->
  </head>
  <body>
    <template>
      <style>
        {{THEME_FONT_IMPORT}}

        :root {
          --theme-bg: {{THEME_BG}};
          --theme-bg-pattern: {{THEME_BG_PATTERN}};
          --theme-text: {{THEME_TEXT}};
          --theme-lead-text: {{THEME_LEAD_TEXT}};
          --theme-accent: {{THEME_ACCENT}};
          --theme-font: {{THEME_FONT}};
          --theme-accent-a20: color-mix(in srgb, var(--theme-accent) 20%, transparent);
        }

        #root {
          position: absolute; inset: 0; width: 1080px; height: 1920px;
          container-type: size; overflow: hidden; background: var(--theme-bg);
          font-family: var(--theme-font); color: var(--theme-text);
        }
        .bg { position: absolute; inset: 0; background-color: var(--theme-bg); background-image: var(--theme-bg-pattern, none); }

        .brand-mark { position: absolute; top: 5cqw; left: 5cqw; width: 6cqw; height: 6cqw; }
        .brand-mark img { display: block; width: 100%; height: 100%; object-fit: contain; object-position: left center; }
        .brand-mark:empty { display: none; }

        .progress-track {
          position: absolute; left: 0; right: 0; bottom: 0;
          height: 4px; background: var(--theme-accent-a20);
        }
        .progress-fill { height: 100%; width: {{PROGRESS_PCT}}; background: var(--theme-accent); }

        .headline {
          position: absolute; left: 50%; top: 50%;
          transform: translate(-50%, -50%);
          margin: 0; max-width: 86cqw;
          display: flex; flex-wrap: wrap; justify-content: center;
          text-align: center; font-weight: 800; font-size: 8.2cqw;
          line-height: 1.08; letter-spacing: -0.02em; color: var(--theme-text);
        }
        .word { display: inline-block; will-change: transform, opacity; }
        .word:not(:last-child) { margin-right: 0.28em; }
        .word.accent { color: var(--theme-accent); }
      </style>

      <div id="root" data-composition-id="{{FRAME_ID}}" data-width="1080" data-height="1920">
        <div class="bg"></div>

        <div class="brand-mark">{{LOGO_MARKUP}}</div>

        <p class="headline" data-role="headline">{{HEADLINE}}</p>

        <div class="progress-track"><div class="progress-fill"></div></div>
      </div>

      <script>
        function hfSplitWords(el) {
          if (!el) return [];
          const raw = (el.textContent || "").trim();
          el.textContent = "";
          const spans = [];
          // Split on [[...]] phrase boundaries first (a bracket pair may wrap more
          // than one word, e.g. "[[really matters]]" — every word inside one pair
          // gets the accent). Trailing punctuation glued to the closing brackets
          // (e.g. "[[results]],") travels with the phrase and lands on its last word.
          const parts = raw.split(/(\[\[[\s\S]+?\]\][.,!?;:]*)/g);
          parts.forEach((part) => {
            if (!part) return;
            const m = part.match(/^\[\[([\s\S]+?)\]\]([.,!?;:]*)$/);
            if (m) {
              const words = m[1].trim().split(/\s+/).filter(Boolean);
              words.forEach((w, i) => {
                const span = document.createElement("span");
                span.className = "word accent";
                span.textContent = w + (i === words.length - 1 ? m[2] : "");
                el.appendChild(span);
                spans.push(span);
              });
            } else {
              part.trim().split(/\s+/).filter(Boolean).forEach((w) => {
                const span = document.createElement("span");
                span.className = "word";
                span.textContent = w;
                el.appendChild(span);
                spans.push(span);
              });
            }
          });
          return spans;
        }

        window.__timelines = window.__timelines || {};
        const root = document.querySelector('[data-composition-id="{{FRAME_ID}}"]');
        const tl = gsap.timeline({ paused: true });

        const words = hfSplitWords(root.querySelector('[data-role="headline"]'));

        // Quick, tight per-word reveal — the fastest tempo in the set (short
        // duration, tight stagger) so it reads as a bridge, then a brief hold.
        tl.fromTo(words, { opacity: 0, y: 22 },
          { opacity: 1, y: 0, duration: 0.32, ease: "power3.out", stagger: 0.06 }, 0.0);

        window.__timelines["{{FRAME_ID}}"] = tl;
      </script>
    </template>
  </body>
</html>

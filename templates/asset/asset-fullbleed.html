<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <!-- GENERIC (per-client themed) HyperFrames sub-composition template.
         Structurally identical to hyperframes_templates/asset/asset-fullbleed.html (same
         markup, same GSAP timeline, same timing) -- ONLY colour, font, and the brand mark are
         parameterized. See CONTRACT.md §3.1.
         CONTENT PLACEHOLDERS (per CONTRACT.md §2):
           {{FRAME_ID}}      unique-per-instance id
           {{PROGRESS_PCT}}  progress-bar fill width
           {{HEADLINE}}      3-8 words; one word may be [[emphasis]] accent
           {{ASSET_SRC}}     relative path to the portfolio image (any aspect ratio -- contained
                              with a blurred/scaled copy of itself filling the letterbox gap)
           {{ASSET_ALT}}     short alt text
         THEME PLACEHOLDERS (per CONTRACT.md §3.1):
           {{THEME_FONT_IMPORT}} {{THEME_TEXT}} {{THEME_ACCENT}} {{THEME_FONT}} {{LOGO_MARKUP}}
           (no {{THEME_BG}} here -- the asset image fills the whole frame, so there is no flat
           background layer to theme)
         NOTE: the bottom `.scrim` gradient stays pure `rgba(0,0,0,*)` on purpose -- it is NOT
         themed. It sits over the PHOTO, not a flat ground, so it is exempt from the "no
         flat-ground gradient" rule and must not be swapped for a theme token (CONTRACT.md §3.1,
         named exception: "asset-fullbleed's bottom scrim"). Do not "fix" this. -->
  </head>
  <body>
    <template>
      <style>
        {{THEME_FONT_IMPORT}}

        :root {
          --theme-text: {{THEME_TEXT}};
          --theme-accent: {{THEME_ACCENT}};
          --theme-font: {{THEME_FONT}};
          --theme-accent-a20: color-mix(in srgb, var(--theme-accent) 20%, transparent);
        }

        #root {
          position: absolute; inset: 0; width: 1080px; height: 1920px;
          container-type: size; overflow: hidden;
          font-family: var(--theme-font); color: var(--theme-text);
        }

        .asset-wrap {
          position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden;
        }
        .asset-bg {
          position: absolute; inset: 0; width: 100%; height: 100%;
          object-fit: cover; display: block;
          filter: blur(30px) brightness(0.55); transform: scale(1.15);
        }
        .asset-img {
          position: relative; width: 100%; height: 100%;
          object-fit: contain; display: block; transform-origin: 50% 50%;
          will-change: transform, opacity;
        }
        .scrim {
          position: absolute; left: 0; right: 0; bottom: 0; height: 60cqh;
          background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.7) 40%, rgba(0,0,0,0) 100%);
        }

        .brand-mark { position: absolute; top: 5cqw; left: 5cqw; width: 6cqw; height: 6cqw; }
        .brand-mark img { display: block; width: 100%; height: 100%; object-fit: contain; object-position: left center; }
        .brand-mark:empty { display: none; }

        .progress-track {
          position: absolute; left: 0; right: 0; bottom: 0;
          height: 4px; background: var(--theme-accent-a20);
        }
        .progress-fill { height: 100%; width: {{PROGRESS_PCT}}; background: var(--theme-accent); }

        .headline {
          position: absolute; left: 8cqw; right: 8cqw; bottom: 12cqh; margin: 0;
          display: flex; flex-wrap: wrap; justify-content: flex-start; text-align: left;
          font-weight: 800; font-size: 7cqw; line-height: 1.1; letter-spacing: -0.02em;
          color: var(--theme-text);
        }
        .word { display: inline-block; will-change: transform, opacity; }
        .word:not(:last-child) { margin-right: 0.28em; }
        .word.accent { color: var(--theme-accent); }
      </style>

      <div id="root" data-composition-id="{{FRAME_ID}}" data-width="1080" data-height="1920">
        <div class="asset-wrap">
          <img class="asset-bg" src="{{ASSET_SRC}}" alt="" aria-hidden="true" />
          <img class="asset-img" data-role="asset" src="{{ASSET_SRC}}" alt="{{ASSET_ALT}}" />
        </div>
        <div class="scrim"></div>

        <div class="brand-mark">{{LOGO_MARKUP}}</div>

        <p class="headline" data-role="headline">{{HEADLINE}}</p>

        <div class="progress-track"><div class="progress-fill"></div></div>
      </div>

      <script>
        function hfSplitWords(el) {
          if (!el) return [];
          const raw = (el.textContent || "").trim();
          el.textContent = "";
          const spans = [];
          // Split on [[...]] phrase boundaries first (a bracket pair may wrap more
          // than one word, e.g. "[[really matters]]" — every word inside one pair
          // gets the accent). Trailing punctuation glued to the closing brackets
          // (e.g. "[[results]],") travels with the phrase and lands on its last word.
          const parts = raw.split(/(\[\[[\s\S]+?\]\][.,!?;:]*)/g);
          parts.forEach((part) => {
            if (!part) return;
            const m = part.match(/^\[\[([\s\S]+?)\]\]([.,!?;:]*)$/);
            if (m) {
              const words = m[1].trim().split(/\s+/).filter(Boolean);
              words.forEach((w, i) => {
                const span = document.createElement("span");
                span.className = "word accent";
                span.textContent = w + (i === words.length - 1 ? m[2] : "");
                el.appendChild(span);
                spans.push(span);
              });
            } else {
              part.trim().split(/\s+/).filter(Boolean).forEach((w) => {
                const span = document.createElement("span");
                span.className = "word";
                span.textContent = w;
                el.appendChild(span);
                spans.push(span);
              });
            }
          });
          return spans;
        }

        window.__timelines = window.__timelines || {};
        const root = document.querySelector('[data-composition-id="{{FRAME_ID}}"]');
        const tl = gsap.timeline({ paused: true });

        const words = hfSplitWords(root.querySelector('[data-role="headline"]'));
        const asset = root.querySelector('[data-role="asset"]');

        // Slow Ken-Burns push + fade-up on the asset (finite, seek-safe).
        tl.fromTo(asset, { opacity: 0, scale: 1.12 },
          { opacity: 1, scale: 1, duration: 3.2, ease: "power1.out" }, 0.0);

        // Headline reveals over the scrim, lower third.
        tl.fromTo(words, { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.08 }, 0.6);

        window.__timelines["{{FRAME_ID}}"] = tl;
      </script>
    </template>
  </body>
</html>
